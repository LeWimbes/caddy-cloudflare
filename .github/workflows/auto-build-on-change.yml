name: Publish Docker image

on:
  schedule:
    - cron: "20 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .github/workflows/auto-build-on-change.yml

# Jobs opt into the permissions they need.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOCKERHUB_REPO: lewimbes/caddy-cloudflare
  GHCR_REPO: ghcr.io/${{ github.repository }}

jobs:
  check-updates:
    name: Check for base image updates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # list GHCR container versions to detect already-published tags
    outputs:
      needs-updating: ${{ steps.check.outputs.needs-updating }}
    steps:
      - name: Check if Caddy base image updated
        id: check
        uses: lucacome/docker-image-update-checker@958e0b396cd5227e7da180826286ef48c20296f9 # v3.1.2
        with:
          base-image: caddy:latest
          image: lewimbes/caddy-cloudflare:latest

  build-and-push:
    name: Build and Push Docker image
    needs: check-updates
    # Run if it's a manual trigger, a code push, or if the update checker found a new base image
    if: github.event_name != 'schedule' || needs.check-updates.outputs.needs-updating == 'true'
    runs-on: ubuntu-latest
    environment: dockerhub
    permissions:
      packages: write # push images to GHCR and attach the attestation to them
      contents: read
      attestations: write # create the build provenance attestation
      id-token: write # mint the OIDC token the attestation is signed with

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Fetch Caddy version
        id: caddy
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/docker-library/official-images/master/library/caddy'
          ver=$(curl -fsSL "$url" | grep -m1 '^Tags:' | \
              sed -E 's/Tags:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "full=$ver"                 >> "$GITHUB_OUTPUT"
          echo "major_minor=${ver%.*}"     >> "$GITHUB_OUTPUT"
          echo "major=${ver%%.*}"          >> "$GITHUB_OUTPUT"
          echo "Resolved Caddy version → $ver"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.GHCR_REPO }}
          tags: |
            type=raw,value=${{ steps.caddy.outputs.full }}
            type=raw,value=${{ steps.caddy.outputs.major_minor }}
            type=raw,value=${{ steps.caddy.outputs.major }}
            type=raw,value=latest

      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: |
            linux/amd64
            linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_REPO }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
